services:
  db:
    image: postgres:16-alpine
    container_name: sama-rides-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: samarides
      POSTGRES_USER: sama
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - sama_rides_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sama -d samarides"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sama_rides_data:
